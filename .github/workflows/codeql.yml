name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 7 * * 1'
permissions:
  contents: read
  security-events: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@7999b86c43a865dc79d8923397f35af22de63401 # v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@7999b86c43a865dc79d8923397f35af22de63401 # v4
